name: Verify Release ABIs (temporary)

# Temporary verification for the -PreleaseAbis splits gate: builds the
# meta release exactly like Build Release does (minus signing and the
# version bump) and lists the APKs it produces. Expected output: only
# the arm64-v8a and armeabi-v7a splits — no universal / x86 / x86_64.
# This file is deleted again once the gate is verified.

on:
  workflow_dispatch:

jobs:
  VerifyReleaseAbis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build meta release with release ABI gate
        run: ./gradlew --no-daemon app:assembleMetaRelease -PreleaseAbis=true

      - name: List produced APKs
        if: success()
        run: |
          echo "== APK files =="
          ls -la app/build/outputs/apk/meta/release/
          echo "== output-metadata.json =="
          cat app/build/outputs/apk/meta/release/output-metadata.json

      - name: Upload output listing
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Release ABI verification output
          path: app/build/outputs/apk/meta/release/output-metadata.json
