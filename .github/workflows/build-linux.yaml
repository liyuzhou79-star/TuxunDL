name: Build Linux

# Builds the Linux desktop edition from the same desktop/ sources as
# the Windows edition. desktop/build.gradle.kts follows the build
# machine's OS, so this workflow produces the .deb and AppImage
# packages while Build Windows keeps producing the MSI/EXE ones from
# the same code.
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-linux.yaml"

jobs:
  BuildLinux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools
        # jpackage shells out to fakeroot/dpkg for the .deb; libfuse2
        # is cheap insurance for the AppImage tooling.
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev libfuse2
          chmod +x gradlew

      - name: Compile desktop app
        run: ./gradlew -p desktop compileKotlin --no-daemon --stacktrace

      - name: Create app image
        if: success()
        run: ./gradlew -p desktop createDistributable --no-daemon --stacktrace

      - name: Upload app image
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: TuxunDL Linux app image
          path: desktop/build/compose/binaries/main/app/**

      - name: Package installers
        if: success()
        run: ./gradlew -p desktop packageDeb packageAppImage --no-daemon --stacktrace

      - name: Assemble AppImage
        if: success()
        # Compose's AppImage target only lays out the app directory
        # (bin/ + lib/); the single-file AppImage users download is
        # packed from that directory with appimagetool. The output
        # file name follows the Linux edition version in
        # desktop/build.gradle.kts — bump both together.
        run: |
          set -e
          appdir="$RUNNER_TEMP/TuxunDL.AppDir"
          mkdir -p "$appdir/usr"
          cp -r desktop/build/compose/binaries/main/app/TuxunDL/. "$appdir/usr/"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/TuxunDL" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          cp desktop/build/compose/binaries/main/app/TuxunDL/lib/TuxunDL.png "$appdir/tuxundl.png"
          ln -s tuxundl.png "$appdir/.DirIcon"
          cat > "$appdir/TuxunDL.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TuxunDL
          Comment=TuxunDL for Linux
          Exec=TuxunDL
          Icon=tuxundl
          Categories=Network;
          Terminal=false
          EOF
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir -p desktop/build/compose/binaries/main/appimage
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$appdir" desktop/build/compose/binaries/main/appimage/TuxunDL-1.1.1.AppImage

      - name: Upload installers
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: TuxunDL Linux installers
          # A missing package must fail loudly instead of warning
          # into the void.
          if-no-files-found: error
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/appimage/*.AppImage
